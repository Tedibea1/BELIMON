name: Build BELLYMON preparation theme

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/generate-preparation.yml"
      - "tests/tools/generate_preparation.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-preparation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install music dependencies
        run: |
          python -m pip install "numpy==2.3.5"
          ffmpeg -version | head -1
      - name: Generate the approved original MP3
        run: |
          python tests/tools/generate_preparation.py
          mkdir -p assets/audio
          cp tests/tools/preparation.mp3 assets/audio/preparation.mp3
          ffprobe -hide_banner -loglevel error -show_entries format=duration,bit_rate -of default=noprint_wrappers=1 assets/audio/preparation.mp3
      - name: Commit the generated track when it changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/preparation.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Add original BELLYMON preparation theme MP3"
            git push
          fi
