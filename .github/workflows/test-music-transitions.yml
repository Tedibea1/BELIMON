name: Test BELIMON music and gameplay regressions

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/test-music-transitions.yml"
      - "js/audio.js"
      - "js/game.js"
      - "index.html"
      - "README.md"
      - "assets/audio/preparation.mp3"
      - "assets/audio/sfx/combat_encounter.mp3"
      - "tests/tests/music_transitions.test.cjs"
      - "tests/tests/branding.test.cjs"
      - "js/shortcuts.js"
      - "tests/tests/v15_3_shortcuts.test.js"
      - "tests/tests/v14_4_shortcuts.test.js"
      - "js/shortcuts.js"
      - "tests/tests/shortcuts_linear.test.cjs"
      - "tests/tests/record_reset_on_free_advance.test.cjs"
      - "js/auto.js"
      - "js/combat.js"
      - "js/guide.js"
      - "tests/tests/unavoidable_special_debuffs.test.cjs"
      - "tests/tests/v15_18_inesquivable_blood_curse.test.js"
      - "tests/tests/v15_19_percent_steal.test.js"
      - "js/v16-motion.js"
      - "css/v16.css"
      - "tests/tests/auto_x4.test.cjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  music-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check js/audio.js
          node --check js/game.js
          node --check js/shortcuts.js
      - name: Soundtrack transitions
        run: node tests/tests/music_transitions.test.cjs
      - name: BELIMON branding and save migration compatibility
        run: node tests/tests/branding.test.cjs
      - name: Linear steak prices and shortcut safety
        run: |
          node --check js/shortcuts.js
          node tests/tests/v15_3_shortcuts.test.js
          node tests/tests/v14_4_shortcuts.test.js
      - name: Linear tower shortcut costs and safe payments
        run: node tests/tests/shortcuts_linear.test.cjs
      - name: Reset old record only on free floor-one advance
        run: node tests/tests/record_reset_on_free_advance.test.cjs
      - name: Magical debuffs through dodge, miss and intangibility
        run: |
          node --check js/combat.js
          node --check js/guide.js
          node tests/tests/unavoidable_special_debuffs.test.cjs
          node tests/tests/v15_18_inesquivable_blood_curse.test.js
          node tests/tests/v15_19_percent_steal.test.js
      - name: AUTO x1 x2 x4 selection and timed magic
        run: |
          node --check js/auto.js
          node --check js/combat.js
          node --check js/v16-motion.js
          node tests/tests/auto_x4.test.cjs
